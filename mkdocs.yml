site_name: Coffee Capsule Production Optimizer Agent
site_description: Agentic BI for a coffee-capsule plant — analyse sensor data, quantify inefficiencies in €, and generate a production plan.
site_author: Marina Bellani
site_url: https://mmbellani.github.io/coffee-capsules-production-optimizer-agent/
repo_url: https://github.com/mmbellani/coffee-capsules-production-optimizer-agent
repo_name: mmbellani/coffee-capsules-production-optimizer-agent
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/coffee
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - Running the App: getting-started/running.md
  - Architecture:
      - architecture/index.md
      - Data Flow: architecture/data-flow.md
      - Repository Structure: architecture/repository-structure.md
  - Data:
      - data/index.md
      - Raw Views: data/raw-views.md
      - Aggregates & Fact Tables: data/aggregates.md
  - Analytics:
      - analytics/index.md
      - KPI Definitions: analytics/kpis.md
  - Dashboard:
      - dashboard/index.md
  - Agent:
      - agent/index.md
      - Workflow: agent/workflow.md
      - Modules: agent/modules.md
      - Production Optimizer: agent/optimizer.md
      - LLM Narrative: agent/llm.md
      - CLI Reference: agent/cli.md
      - Outputs: agent/outputs.md
  - Demo & Hackathon:
      - demo/index.md
  - FAQ: faq.md
